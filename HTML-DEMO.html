<title>Modas Naty · Notas de venta</title>
<style>
:root{--p:#2563eb;--pd:#1d4ed8;--bg:#f4f6fa;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--g:#16a34a;--o:#ea580c;--r:#dc2626}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
aside{width:230px;background:#fff;color:#334155;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;transition:transform .2s;border-right:1px solid var(--b)}
.brand{padding:16px 18px;font-weight:700;color:var(--t);font-size:17px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b)}
.brand img{width:38px;height:38px;border-radius:50%;flex:none;background:#000}
#nav{flex:1;padding:10px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-bottom:4px;border:0;border-radius:8px;background:none;color:inherit;cursor:pointer;text-align:left;font-weight:500}
#nav button:hover{background:#f1f5f9}
#nav button.on{background:var(--p);color:#fff}
.foot{padding:14px;font-size:12px;color:#94a3b8}
.ic{flex:none;vertical-align:middle}
.btn .ic,.tag .ic,.seg .ic{vertical-align:-3px}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:middle}
.main{margin-left:230px;flex:1;min-width:0}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--b)}
.sp{flex:1}
#burger{display:none;border:1px solid var(--b);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.pill{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;background:#dcfce7;color:#166534}
.pill.slow{background:#ffedd5;color:#9a3412}.pill.off{background:#fee2e2;color:#991b1b}
select,input{border:1px solid var(--b);border-radius:8px;padding:8px 10px;background:#fff;max-width:100%}
input:focus,select:focus{outline:2px solid #93c5fd;border-color:var(--p)}
main{padding:16px;max-width:1200px}
h2{font-size:20px;margin-bottom:12px}h3{font-size:15px;margin:0 0 10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px}
.kpi small{color:var(--m)}.kpi b{display:block;font-size:22px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.btn{border:0;border-radius:8px;background:var(--p);color:#fff;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pd)}.btn:disabled{opacity:.5;cursor:wait}
.btn.sec{background:#e2e8f0;color:var(--t)}.btn.wa{background:#16a34a}.btn.big{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:5px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--b);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--m)}
.seg button+button{border-left:1px solid var(--b)}
.seg button.on{background:var(--p);color:#fff}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--m);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--b)}
td{padding:9px 8px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.r{text-align:right}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.grn{background:#dcfce7;color:#166534}.amb{background:#ffedd5;color:#9a3412}.red{background:#fee2e2;color:#991b1b}.blu{background:#dbeafe;color:#1e40af}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.line .n{flex:1;min-width:0}.line .n small{color:var(--m);display:block}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border:1px solid var(--b);background:#fff;border-radius:8px;cursor:pointer;font-size:16px}
.qty input{width:50px;text-align:center;padding:5px}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin:12px 0}
.f{display:grid;gap:8px;margin-top:8px}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.vb{display:grid;grid-template-columns:140px 1fr 150px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.vb b{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:120px}
.fld{display:flex;flex-direction:column;gap:3px}.fld small{color:var(--m);font-size:12px}.fld input,.fld select{width:100%}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
#modal{display:none;position:fixed;inset:0;background:#0f172acc;z-index:50;padding:14px;overflow:auto}
#modal.on{display:block}
.note{background:#fff;max-width:600px;margin:0 auto;border-radius:12px;padding:20px}
.note h3{text-align:center;font-size:18px}.note .meta{font-size:14px;margin:12px 0;border-top:1px dashed #94a3b8;border-bottom:1px dashed #94a3b8;padding:10px 0}
.note .meta div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1;min-width:150px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90%}
#shade{display:none}
.empty{color:var(--m);padding:14px;text-align:center}
/* Comprobante de impresión */
#pa{display:none}
.rc{max-width:720px;margin:0 auto;color:#000;font:13px/1.45 Arial,Helvetica,sans-serif}
.rc .rh{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.rc .rh b{font-size:20px;letter-spacing:1px;display:block}
.rc .rh span{font-size:12px}
.rc h1{font-size:22px;text-align:center;margin:10px 0;letter-spacing:2px}
.rc .rm{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;border:1px solid #000;padding:8px 10px;margin-bottom:12px}
.rc .rm div{display:flex;justify-content:space-between;gap:8px}
.rc table{width:100%;border-collapse:collapse;font-size:12.5px}
.rc th{color:#000;border-bottom:2px solid #000;border-top:1px solid #000;padding:6px 5px;font-size:11px}
.rc td{border-bottom:1px solid #999;padding:6px 5px;white-space:normal}
.rc .rt{display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:2px solid #000;margin-top:10px;padding-top:8px}
.rc .rf{text-align:center;margin-top:22px;font-size:12px}
.rc .fm{display:flex;justify-content:space-between;margin-top:46px;font-size:12px}
.rc .fm span{width:42%;border-top:1px solid #000;text-align:center;padding-top:4px}
@media print{
@page{margin:12mm}
html,body{background:#fff!important}
body>*:not(#pa){display:none!important}
#pa{display:block!important}
}
@media(max-width:900px){
aside{transform:translateX(-100%)}aside.on{transform:none}
#shade.on{display:block;position:fixed;inset:0;background:#0006;z-index:25}
.main{margin-left:0}#burger{display:block}.grid2{grid-template-columns:1fr}
.vb{grid-template-columns:100px 1fr;gap:4px 8px}.vb b{grid-column:2;text-align:left}
}

/* ---------- Datos ---------- */
function seed(){
  const P=[['Remeras de mujer',45,120],['Pantalón jean clásico',120,84],['Camisa manga larga',85,72],['Short deportivo',50,96],['Buzo canguro',110,60],['Campera rompevientos',150,48],['Vestido de verano',95,30],['Calza deportiva',55,108],['Medias',15,200],['Gorra con visera',30,144],['Remera estampada',50,90],['Chombas',70,64],['Camisa a cuadros',80,12],['Buzo cuello redondo',100,56]]
   .map((p,i)=>({id:'p'+(i+1),n:p[0],p:p[1],s:p[2]}));
  const db={products:P,sales:[],moves:[],seq:1};
  for(let i=0;i<12;i++){
    const cur=CURKEYS[i%3];
    const nItems=1+(i%3);
    const items=[];
    for(let k=0;k<nItems;k++){
      const pr=P[(i*3+k*5)%P.length];
      const qty=1+((i+k)%4);
      const price=cur=='ars'?pr.p*100:cur=='usd'?Math.max(1,Math.round(pr.p/7)):pr.p;
      items.push({name:pr.n,qty,price});
    }
    const date=i<7?Date.now()-i*23*60000:Date.now()-86400000-(i-6)*3600000;
    const pay=(i%2)?'transferencia':'efectivo';
    const cli=['Cliente general','Boutique Rosa','Tienda El Sol','Pedro Vaca'][i%4];
    mkSale(db,VEND[i%4].id,cli,'',cur,pay,items,date,'ok');
  }
  [['p13',30,'Compra proveedor'],['p8',15,'Compra proveedor'],['p10',10,'Compra proveedor']].forEach(([id,q,why])=>{const p=P.find(x=>x.id==id);p.s+=q;db.moves.push({id:db.moves.length+1,date:Date.now()-3600000*5,type:'entrada',pid:id,n:p.n,q,why,by:'Encargado'})});
  return db;
}
function mkSale(db,vid,cli,tel,cur,pay,items,date,st){
  const total=sum(items,i=>i.qty*i.price);
  const s={id:db.seq,n:nro(db.seq++),date,vid,cli,tel:tel||'',cur:cur||'bs',pay:pay||'efectivo',items,total,com:total*COM,st};
  db.sales.unshift(s);
  return s;
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.products)return d}catch(e){}const d=seed();save(d);return d}

function exportVentas(){
  const l=ventasData();
  if(!l.length)return toast('No hay ventas para exportar');
  const cols=['Nº','Fecha','Vendedor','Tel. vendedor','Cliente','WhatsApp cliente','Moneda','Forma de pago','Productos','Total','Estado'];
  const fnum=n=>Number(n||0).toFixed(2).replace('.',',');
  const rows=l.map(s=>[s.n,fdl(s.date),vname(s.vid),vtel(s.vid),s.cli,s.tel||'',(CURS[s.cur]||CURS.bs).full,payTxt(s.pay),s.items.map(i=>`${i.qty}x ${i.name} (${money(i.price,s.cur)})`).join(' | '),fnum(s.total),s.st=='pend'?'Pendiente':'Sincronizada']);
  const cq=v=>{v=String(v==null?'':v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv=[cols,...rows].map(r=>r.map(cq).join(';')).join('\r\n');
  const blob=new Blob([String.fromCharCode(0xFEFF)+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='ventas_modasnaty_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Exportadas '+l.length+' venta(s) a Excel');
}

<input id="ew" placeholder="Motivo (ej. Compra proveedor)">
<button class="btn" data-a="entry">Registrar</button></div></div>
<div class="card tw"><h3>Stock actual</h3><table><tr><th>Producto</th><th class="r">Stock</th><th class="r">Precio ref. (Bs)</th><th>Estado</th></tr>${db.products.map(p=>{const s=stProd(p);return `<tr><td>${esc(p.n)}</td><td class="r"><b>${p.s}</b></td><td class="r">${money(p.p,'bs')}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join('')}</table></div>
<div class="card tw"><h3>Historial de movimientos</h3>${moves.length?`<table><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th class="r">Cant.</th><th>Motivo</th><th>Por</th></tr>${moves.map(m=>`<tr><td>${fd(m.date)}</td><td><span class="tag ${m.type=='entrada'?'blu':'amb'}">${m.type=='entrada'?ic('up',13)+' Entrada':ic('down',13)+' Salida'}</span></td><td>${esc(m.n)}</td><td class="r">${m.q}</td><td>${esc(m.why)}</td><td>${esc(m.by)}</td></tr>`).join('')}</table>${db.moves.length>50?'<p class="empty">Mostrando los últimos 50 movimientos</p>':''}`:'<div class="empty">Todavía no hay movimientos registrados</div>'}</div>`;
}
function entry(){
  const id=$('#ep').value,t=$('#et').value,q=parseInt($('#eq').value),w=$('#ew').value.trim();
  const p=db.products.find(x=>x.id==id);
  if(!q||q<1)return toast('Ingresá una cantidad válida');
  if(t=='salida'&&q>p.s)return toast('No hay stock suficiente');
  p.s+=t=='entrada'?q:-q;
  db.moves.push({id:db.moves.length+1,date:Date.now(),type:t,pid:id,n:p.n,q,why:w||(t=='entrada'?'Entrada de mercadería':'Ajuste'),by:user.name});
  save();toast('Movimiento registrado');render();
}

/* ---------- Comisiones ---------- */
let cf={desde:'',hasta:'',sort:'ventas'};
const cell=(n,cur)=>n?money(n,cur):'<span style="color:#cbd5e1">—</span>';
function com(){
  let l=db.sales.slice();
  if(cf.desde){const t=new Date(cf.desde+'T00:00:00').getTime();l=l.filter(s=>s.date>=t)}
  if(cf.hasta){const t=new Date(cf.hasta+'T23:59:59.999').getTime();l=l.filter(s=>s.date<=t)}
  let r=VEND.map(v=>{const x=l.filter(s=>s.vid==v.id);const c=sumCur(x);const k={};CURKEYS.forEach(ck=>k[ck]=c[ck]*COM);return {n:v.name,q:x.length,c,k}});
  r.sort((a,b)=>cf.sort=='ventas'?b.q-a.q:(b.c[cf.sort]||0)-(a.c[cf.sort]||0));
  const tot={q:sum(r,x=>x.q),c:{},k:{}};CURKEYS.forEach(ck=>{tot.c[ck]=sum(r,x=>x.c[ck]);tot.k[ck]=sum(r,x=>x.k[ck])});
  return `<h2>Comisiones</h2><div class="card"><div class="row">
<label class="fld" style="min-width:140px"><small>Desde</small><input type="date" id="cfDesde" value="${cf.desde}"></label>
<label class="fld" style="min-width:140px"><small>Hasta</small><input type="date" id="cfHasta" value="${cf.hasta}"></label>
<label class="fld" style="min-width:200px"><small>Ordenar por (mayor primero)</small><select id="cfSort"><option value="ventas" ${cf.sort=='ventas'?'selected':''}>Cantidad de ventas</option>${CURKEYS.map(k=>`<option value="${k}" ${cf.sort==k?'selected':''}>Total vendido ${CURS[k].sym}</option>`).join('')}</select></label>
<label class="fld" style="min-width:110px"><small>&nbsp;</small><button class="btn sec" data-a="cfclear">Limpiar</button></label>
</div>
<p style="color:var(--m);margin:10px 0 4px">Comisión de ejemplo: ${COM*100}% del total vendido</p>
<div class="tw"><table><tr><th>Vendedor</th><th class="r">Ventas</th>${CURKEYS.map(k=>`<th class="r">Total ${CURS[k].sym}</th>`).join('')}${CURKEYS.map(k=>`<th class="r">Comisión ${CURS[k].sym}</th>`).join('')}</tr>${r.map(x=>`<tr><td>${esc(x.n)}</td><td class="r">${x.q}</td>${CURKEYS.map(k=>`<td class="r">${cell(x.c[k],k)}</td>`).join('')}${CURKEYS.map(k=>`<td class="r"><b>${cell(x.k[k],k)}</b></td>`).join('')}</tr>`).join('')}
<tr><td><b>Total</b></td><td class="r"><b>${tot.q}</b></td>${CURKEYS.map(k=>`<td class="r"><b>${cell(tot.c[k],k)}</b></td>`).join('')}${CURKEYS.map(k=>`<td class="r"><b>${cell(tot.k[k],k)}</b></td>`).join('')}</tr></table></div></div>`;
}

/* ---------- Sincronización ---------- */
async function sync(){
  const p=db.sales.filter(s=>s.st=='pend');
  if(!p.length)return;
  if(conn=='off')return toast('Sin conexión: se sincronizará al volver');
  toast('Sincronizando '+p.length+'…');
  if(conn=='slow')await sleep(2000);
  if(conn=='off')return;
  p.forEach(s=>s.st='ok');save();toast(p.length+' venta(s) sincronizada(s)');render();
}
function setConn(c){const prev=conn;conn=c;head();if(prev=='off'&&c!='off')sync()}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,ix=+b.dataset.ix;
  if(a=='go'){view=b.dataset.v;$('#side').classList.remove('on');$('#shade').classList.remove('on');render()}
  else if(a=='cur'){if(cart.length)return toast('Vaciá la venta para cambiar de moneda');cur=b.dataset.c;render()}
  else if(a=='pay'){pay=b.dataset.p;document.querySelectorAll('#payseg button').forEach(x=>x.classList.toggle('on',x.dataset.p==pay))}
  else if(a=='additem')addItem();
  else if(a=='inc'){cart[ix].qty++;cartUI()}
  else if(a=='dec'){const it=cart[ix];if(it.qty<=1){cart.splice(ix,1);render()}else{it.qty--;cartUI()}}
  else if(a=='del'){cart.splice(ix,1);render()}
  else if(a=='confirm')confirmSale();
  else if(a=='ver')note(db.sales.find(x=>x.id==id));
  else if(a=='wa')wa(id);
  else if(a=='print')printNote(id);
  else if(a=='close'){$('#modal').className='';if(b.dataset.nv&&can('venta')){view='venta';render()}}
  else if(a=='entry')entry();
  else if(a=='sync')sync();
  else if(a=='export')exportVentas();
  else if(a=='vfclear'){vf={desde:'',hasta:'',vend:'',moneda:'',pago:'',estado:'',q:''};render()}
  else if(a=='cfclear'){cf={desde:'',hasta:'',sort:'ventas'};render()}
});
document.addEventListener('input',e=>{
  if(e.target.id=='cn')cli.n=e.target.value;
  if(e.target.id=='ct')cli.t=e.target.value;
  if(e.target.id=='in'){const p=db.products.find(x=>x.n.toLowerCase()==e.target.value.trim().toLowerCase());if(p&&cur=='bs'){const pe=$('#ip');if(pe&&!pe.value)pe.value=p.p}}
  if(e.target.id=='vfQ'){vf.q=e.target.value;const b=$('#ventasBody');if(b)b.innerHTML=ventasBody()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.q!=null){const ix=+e.target.dataset.q;let q=parseInt(e.target.value)||1;if(q<1)q=1;cart[ix].qty=q;cartUI()}
  const vm={vfDesde:'desde',vfHasta:'hasta',vfVend:'vend',vfMoneda:'moneda',vfPago:'pago',vfEstado:'estado'};
  if(vm[e.target.id]){vf[vm[e.target.id]]=e.target.value;render()}
  const cm={cfDesde:'desde',cfHasta:'hasta',cfSort:'sort'};
  if(cm[e.target.id]){cf[cm[e.target.id]]=e.target.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&['in','iq','ip'].includes(e.target.id)){e.preventDefault();addItem()}});
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')e.target.className=''});
$('#burger').onclick=()=>{$('#side').classList.toggle('on');$('#shade').classList.toggle('on')};
$('#shade').onclick=()=>{$('#side').classList.remove('on');$('#shade').classList.remove('on')};
$('#connSel').onchange=e=>setConn(e.target.value);
$('#userSel').innerHTML=USERS.map(u=>`<option value="${u.id}">${u.name}${u.role=='v'?' (Vendedor)':u.role=='e'?' (Encargado)':''}</option>`).join('');
$('#userSel').onchange=e=>{user=USERS.find(u=>u.id==e.target.value);cart=[];cli={n:'',t:''};pay='efectivo';view=user.role=='a'?'dash':user.role=='e'?'stock':'venta';$('#modal').className='';render()};
// Tiempo real entre pestañas (otra pestaña/vendedor guarda → se actualiza aquí)
window.addEventListener('storage',e=>{if(e.key==KEY){db=load();if(view!='venta')render();else head()}});
window.addEventListener('offline',()=>{$('#connSel').value='off';setConn('off')});
window.addEventListener('online',()=>{$('#connSel').value='on';setConn('on')});
render();
</script></body></html>
