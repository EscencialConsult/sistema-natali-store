[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  TZ = "America/La_Paz"

# Netlify Functions (checkout, webhook de pagos, reembolso, kiosco, sitemap, vista previa de productos). Ruta relativa a `base`.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Respaldo del pg_cron: vence reservas de stock cada 5 minutos.
[functions."vencer-reservas"]
  schedule = "*/5 * * * *"

# Respaldo del aviso de pago: confirma los pedidos cuyo pago ya está aprobado en Mercado Pago aunque el aviso no haya llegado.
[functions."reconciliar-pagos"]
  schedule = "*/10 * * * *"

# Orden importa: gana la primera que coincide.
# El sitemap y la ficha de producto pasan por una Function (para que WhatsApp y Google vean foto, nombre y precio).
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/p/:slug"
  to = "/.netlify/functions/og-producto?slug=:slug"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad en todo el sitio. La política (CSP) es la de app/csp.js; una prueba verifica que sean idénticas.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mercadopago.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"

# Panel y kiosco no se indexan (además de robots.txt y la etiqueta noindex).
[[headers]]
  for = "/administracion/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/kiosco/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# El service worker y el manifest siempre frescos; los assets con hash, un año.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
